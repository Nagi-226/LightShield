# =============================================================================
# LightShield 质量门禁 — GitHub Actions CI
# =============================================================================
# 触发条件：PR 到 main 或推送到 main
# 执行的检查与本地 pre-commit run --all-files 完全一致
# =============================================================================

name: LightShield Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 取消同一 PR 的旧运行（节省 CI 资源）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Job 1: 代码质量检查（pre-commit 全套）
  # ===========================================================================
  pre-commit:
    name: "Gate A-C: 合规 + Lint + 安全 + 类型"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 pre-commit
        run: pip install pre-commit

      - name: 缓存 pre-commit 环境
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: 运行全部检查（--all-files）
        run: pre-commit run --all-files --show-diff-on-failure

  # ===========================================================================
  # Job 2: 单元测试
  # ===========================================================================
  test:
    name: "Gate E: 测试 (${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    needs: pre-commit  # 只有 lint/合规 通过了才跑测试
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          pip install -e ".[dev]"
          pip install pytest

      - name: 运行测试
        run: python -m pytest tests/ -v --tb=short

  # ===========================================================================
  # Job 3: 依赖安全审计
  # ===========================================================================
  security-audit:
    name: "依赖安全审计 (pip-audit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 pip-audit
        run: pip install pip-audit

      - name: 扫描已知漏洞
        run: pip-audit

  # ===========================================================================
  # Job 4: Gate B 范围忠实度 — 大 PR 预警
  # ===========================================================================
  scope-check:
    name: "Gate B: 范围忠实度"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 文件变更数量检查
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD | wc -l)
          echo "变更文件数: $CHANGED"
          if [ $CHANGED -gt 20 ]; then
            echo "⚠️ 大 PR 警告: $CHANGED 个文件变更。请考虑拆分。"
          fi
          if [ $CHANGED -gt 50 ]; then
            echo "❌ PR 过大: $CHANGED 个文件变更。超过 50 个文件上限，必须拆分。"
            exit 1
          fi
