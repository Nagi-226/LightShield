# ============================================================
# LightShield 轻盾 — Docker Compose 部署
# 使用方式：
#   docker compose up -d         # 后台启动
#   docker compose logs -f       # 查看日志
#   docker compose down          # 停止并删除容器
# ============================================================

services:
  lightshield:
    # 使用项目根目录的 Dockerfile 构建
    build: .
    # 也可直接使用预构建镜像（待发布后启用）
    # image: lightshield/lightshield:latest

    # 默认仅监听本地回环地址（安全），外部不可访问
    # 如需公网/局域网访问，将 127.0.0.1:5000 改为 0.0.0.0:5000
    ports:
      - "127.0.0.1:5000:5000"

    # 环境变量：覆盖 Web 仪表板默认凭证
    # 不设置则使用代码内置默认值（admin / lightshield）
    environment:
      - LS_WEB_USERNAME=${LS_WEB_USERNAME:-admin}
      - LS_WEB_PASSWORD=${LS_WEB_PASSWORD:-lightshield}

    # 数据持久化：SQLite 数据库 + 扫描报告
    # ./data/ 目录会自动创建在 docker-compose.yml 同层
    volumes:
      - ./data:/data

    # 容器崩溃或宿主机重启后自动拉起
    restart: unless-stopped

    # 健康检查（与 Dockerfile HEALTHCHECK 一致，Compose 层可覆盖）
    # healthcheck:
    #   test: ["CMD", "curl", "-sf", "http://127.0.0.1:5000/static/style.css"]
    #   interval: 30s
    #   timeout: 5s
    #   retries: 3
    #   start_period: 10s
